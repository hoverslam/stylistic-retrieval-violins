[project]
name = "stylistic-retrieval"
version = "0.1.0"
description = "Retrieve historical violins based on stylistic similarities using Deep Learning."
requires-python = ">=3.10"
authors = [
    { name = "Christopher Hofmann", email = "hoverslam@proton.me" }
]
license = "MIT"
readme = "README.md"

dependencies = [
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "xformers>=0.0.28; sys_platform != 'win32'",
    "pytorch-metric-learning>=2.8.1",
    "ipykernel>=6.29.5",
    "pandas>=2.2.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.160",
    "scikit-learn>=1.6.1",
    "wandb>=0.20.1",
    "typing-extensions>=4.14.0",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.27.1",
    "ruff>=0.11.0",
    "nvidia-htop>=1.2.0",
    "doxapy>=0.9.2",
    "peft==0.17.1",
    "transformers>=4.53,<5",
    "label-studio>=1.21.0",
    "umap-learn[plot]>=0.5.8",
    "plotly>=6.5.0",
    "pytest>=9.0.2",
    "albumentationsx>=2.0.12",
    "reportlab>=4.4.9",
    "openpyxl>=3.1.5",
    "nvidia-htop",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stylistic_retrieval"]

[[tool.uv.index]]
name = "pytorch-cuda-124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true 

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda-124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pypi", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda-124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pypi", marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
]
